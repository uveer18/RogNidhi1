services:
  - type: web
    name: rognidhi-backend
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn --chdir backend config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: rognidhi-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: rognidhi-db
    plan: free
